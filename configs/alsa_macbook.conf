# ALSA Sound Configuration for Apple MacBook Air / Pro (Cirrus Logic CS4208 / CS4206)

pcm.!default {
    type hw
    card 0
    device 0
}

ctl.!default {
    type hw
    card 0
}

# Fix speaker gain and headphone switching on Cirrus codec
cards.HDA-Intel.pcm.default.0 {
    type softvol
    slave.pcm "hw:0,0"
    control {
        name "Master"
        card 0
    }
}
