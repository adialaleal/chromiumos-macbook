# ChromiumOS Touchpad CMT / Libinput Tuning for Apple Trackpads (MacBook Air / Pro)

Section "InputClass"
    Identifier "Apple Multi-touch Trackpad Tuning"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"
    MatchDriver "libinput"

    # Tap-to-click and natural two-finger scrolling
    Option "Tapping" "on"
    Option "NaturalScrolling" "true"
    Option "ClickMethod" "clickfinger"
    Option "MiddleEmulation" "true"

    # Palm Rejection Tuning for Apple Glass Trackpads
    Option "PalmDetection" "on"
    Option "PalmMinWidth" "8"
    Option "PalmMinZ" "100"

    # Smooth Scrolling & Acceleration
    Option "AccelProfile" "adaptive"
    Option "AccelSpeed" "0.2"
EndSection
